[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitles-generator"
version = "0.1.0"
description = "Generate .srt subtitles from a video or audio file using Whisper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
maintainers = [{ name = "Konstantin Verner", email = "konst.verner@gmail.com" }]
keywords = ["subtitles", "whisper", "speech-to-text", "srt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately loose / no upper bounds and no pin on torch. Environments
# like Google Colab already ship a GPU-matched torch + transformers
# build; pinning exact old versions here forces pip to reinstall them,
# which is what used to break things. If you don't already have torch
# installed, install it yourself first following https://pytorch.org
# (so you get the right CUDA build for your machine).
dependencies = [
    "transformers>=4.41",
    "accelerate>=0.30",
]

[project.optional-dependencies]
# Only needed if you don't already have torch (e.g. outside Colab).
torch = ["torch>=2.1"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
